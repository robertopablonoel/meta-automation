<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubby's Place — Addison Group Creative Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* Agency header */
  .agency-header {
    background: #1a1a2e;
    color: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 200;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .agency-header .agency-name {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.55;
    font-weight: 500;
  }
  .agency-header .client-name {
    font-size: 15px;
    font-weight: 700;
  }
  .agency-header .badge {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 3px 11px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* Profile strip */
  .profile-strip {
    max-width: 600px;
    margin: 24px auto 0;
    padding: 0 16px 16px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid #dbdbdb;
  }
  .profile-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: white;
    flex-shrink: 0;
  }
  .profile-info .handle { font-size: 16px; font-weight: 600; color: #111; }
  .profile-info .bio { font-size: 12px; color: #555; margin-top: 3px; line-height: 1.4; }
  .profile-stats {
    display: flex;
    gap: 20px;
    margin-top: 8px;
  }
  .profile-stats span { font-size: 12px; color: #555; }
  .profile-stats strong { font-weight: 700; color: #111; }

  /* Grid */
  .grid {
    max-width: 600px;
    margin: 0 auto;
    padding: 3px 16px 60px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-top: 3px;
  }
  .grid-item {
    aspect-ratio: 1;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    background: #efefef;
  }
  .grid-item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .grid-item img.active { opacity: 1; }
  .grid-item .grid-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0);
    display: flex;
    align-items: flex-end;
    padding: 8px;
    transition: background 0.2s;
  }
  .grid-item:hover .grid-overlay { background: rgba(0,0,0,0.25); }
  .grid-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: white;
    opacity: 0;
    transition: opacity 0.2s;
    line-height: 1.3;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .grid-item:hover .grid-label { opacity: 1; }
  /* Multi-image indicator */
  .multi-badge {
    position: absolute;
    top: 7px;
    right: 7px;
    opacity: 0.9;
  }
  .multi-badge svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }

  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  /* Instagram card (modal) */
  .ig-card {
    background: white;
    border-radius: 4px;
    overflow: hidden;
    width: 100%;
    max-width: 340px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    position: relative;
  }

  .modal-close {
    position: fixed;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
    z-index: 310;
  }

  /* Card header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    position: sticky;
    top: 0;
    background: white;
    z-index: 10;
    border-bottom: 1px solid #f0f0f0;
  }
  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: white;
    flex-shrink: 0;
  }
  .card-handle { font-size: 12px; font-weight: 600; color: #111; }
  .card-location { font-size: 10px; color: #888; }
  .card-menu { margin-left: auto; color: #888; font-size: 16px; }

  /* Carousel */
  .carousel {
    position: relative;
    aspect-ratio: 1;
    background: #000;
    overflow: hidden;
  }
  .carousel-track {
    display: flex;
    height: 100%;
    transition: transform 0.3s ease;
  }
  .carousel-slide {
    min-width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.85);
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    color: #111;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    z-index: 10;
  }
  .carousel-btn.prev { left: 7px; }
  .carousel-btn.next { right: 7px; }
  .carousel-btn.hidden { display: none; }

  .carousel-dots {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transition: background 0.2s;
  }
  .dot.active { background: white; }

  .slide-counter {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.5);
    color: white;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
  }

  /* Actions */
  .card-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px 4px;
  }
  .action-icon { width: 20px; height: 20px; opacity: 0.75; cursor: pointer; }
  .action-icon:hover { opacity: 1; }
  .save-icon { margin-left: auto; }

  /* Caption */
  .card-caption { padding: 0 12px 12px; }
  .caption-concept {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #1a1a2e;
    opacity: 0.45;
    margin-bottom: 4px;
  }
  .caption-headline {
    font-size: 12px;
    font-weight: 700;
    color: #111;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .caption-text {
    font-size: 12px;
    color: #111;
    line-height: 1.5;
    white-space: pre-line;
  }
  .caption-description {
    display: inline-block;
    margin-top: 5px;
    font-size: 10px;
    color: #555;
    background: #f5f5f5;
    padding: 2px 7px;
    border-radius: 8px;
  }

  /* Variation picker */
  .variation-picker {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 12px 12px;
    border-top: 1px solid #f5f5f5;
  }
  .variation-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #bbb;
    margin-right: 2px;
  }
  .var-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid #ddd;
    background: white;
    font-size: 9px;
    font-weight: 700;
    color: #888;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .var-btn.active { background: #1a1a2e; border-color: #1a1a2e; color: white; }
  .var-btn:hover:not(.active) { border-color: #1a1a2e; color: #1a1a2e; }
</style>
</head>
<body>

<header class="agency-header">
  <div>
    <div class="agency-name">The Addison Group</div>
    <div class="client-name">Bubby's Place</div>
  </div>
  <div class="badge">Creative Preview</div>
</header>

<div class="profile-strip">
  <div class="profile-avatar">B</div>
  <div class="profile-info">
    <div class="handle">bubbysplace</div>
    <div class="bio">Meeting needs and changing lives in foster care.<br>Suffolk, VA · Hampton Roads · 501(c)(3)</div>
    <div class="profile-stats">
      <span id="post-count"><strong>—</strong> posts</span>
      <span><strong>5</strong> concepts</span>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <button class="modal-close" id="modal-close">✕</button>
  <div class="ig-card" id="modal-card"></div>
</div>

<script>
const IMG_BASE = '../input_images/';
const DATA_URL = '../output/consolidated_en.json';

const CONCEPT_LABELS = {
  emergency_placement_urgency: 'Emergency Placement Urgency',
  concrete_donation_anchors: 'Concrete Donation Anchors',
  real_family_social_proof: 'Real Family & Social Proof',
  founder_origin_story: 'Founder Origin Story',
  statistical_education_hooks: 'Statistical Education Hooks',
};

let groups = {};

async function load() {
  const res = await fetch(DATA_URL);
  const data = await res.json();

  document.getElementById('post-count').innerHTML = `<strong>${data.length}</strong> posts`;

  for (const item of data) {
    const cat = item.creative_concept || 'uncategorized';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(item);
  }

  const grid = document.getElementById('grid');
  for (const [concept, items] of Object.entries(groups)) {
    const thumb = items[0].filename;
    const label = CONCEPT_LABELS[concept] || concept.replace(/_/g, ' ');
    const multi = items.length > 1;

    const cell = document.createElement('div');
    cell.className = 'grid-item';

    const allImages = items.map(i => i.filename);
    allImages.forEach((filename, i) => {
      const img = document.createElement('img');
      img.src = IMG_BASE + filename;
      img.alt = '';
      img.loading = 'lazy';
      if (i === 0) img.classList.add('active');
      cell.appendChild(img);
    });

    cell.insertAdjacentHTML('beforeend', `
      <div class="grid-overlay">
        <div class="grid-label">${label}</div>
      </div>
      ${multi ? `<div class="multi-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M2 6a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6zm14-4h1a3 3 0 013 3v1M2 10h18"/></svg></div>` : ''}
    `);

    if (allImages.length > 1) {
      let cur = 0;
      const imgs = cell.querySelectorAll('img');
      setInterval(() => {
        imgs[cur].classList.remove('active');
        cur = (cur + 1) % imgs.length;
        imgs[cur].classList.add('active');
      }, 2000);
    }

    cell.addEventListener('click', () => openModal(concept));
    grid.appendChild(cell);
  }
}

function openModal(concept) {
  const items = groups[concept];
  const images = items.map(i => i.filename);
  const variations = items[0].ad_copy_variations || [];
  const label = CONCEPT_LABELS[concept] || concept.replace(/_/g, ' ');

  const card = document.getElementById('modal-card');
  card.innerHTML = '';
  card.appendChild(buildCard(label, images, variations));
  card.scrollTop = 0;

  document.getElementById('modal').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('modal').classList.remove('open');
});

function buildCard(label, images, variations) {
  const wrap = document.createDocumentFragment();

  // Header
  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `
    <div class="avatar">B</div>
    <div>
      <div class="card-handle">bubbysplace</div>
      <div class="card-location">Suffolk, VA · Hampton Roads</div>
    </div>
    <div class="card-menu">···</div>
  `;
  wrap.appendChild(header);

  // Carousel
  const carousel = document.createElement('div');
  carousel.className = 'carousel';

  const track = document.createElement('div');
  track.className = 'carousel-track';
  images.forEach(img => {
    const slide = document.createElement('div');
    slide.className = 'carousel-slide';
    const el = document.createElement('img');
    el.src = IMG_BASE + img;
    el.alt = '';
    slide.appendChild(el);
    track.appendChild(slide);
  });
  carousel.appendChild(track);

  if (images.length > 1) {
    const dots = document.createElement('div');
    dots.className = 'carousel-dots';
    images.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      dots.appendChild(d);
    });
    carousel.appendChild(dots);

    const counter = document.createElement('div');
    counter.className = 'slide-counter';
    counter.textContent = `1 / ${images.length}`;
    carousel.appendChild(counter);

    const prevBtn = document.createElement('button');
    prevBtn.className = 'carousel-btn prev hidden';
    prevBtn.textContent = '‹';
    const nextBtn = document.createElement('button');
    nextBtn.className = 'carousel-btn next';
    nextBtn.textContent = '›';
    carousel.appendChild(prevBtn);
    carousel.appendChild(nextBtn);

    let cur = 0;
    const update = () => {
      track.style.transform = `translateX(-${cur * 100}%)`;
      dots.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === cur));
      counter.textContent = `${cur + 1} / ${images.length}`;
      prevBtn.classList.toggle('hidden', cur === 0);
      nextBtn.classList.toggle('hidden', cur === images.length - 1);
    };
    prevBtn.addEventListener('click', () => { if (cur > 0) { cur--; update(); } });
    nextBtn.addEventListener('click', () => { if (cur < images.length - 1) { cur++; update(); } });
  }

  wrap.appendChild(carousel);

  // Actions
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  actions.innerHTML = `
    <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    <svg class="action-icon save-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  `;
  wrap.appendChild(actions);

  // Caption
  const caption = document.createElement('div');
  caption.className = 'card-caption';
  const conceptEl = document.createElement('div');
  conceptEl.className = 'caption-concept';
  conceptEl.textContent = label;
  const headlineEl = document.createElement('div');
  headlineEl.className = 'caption-headline';
  const textEl = document.createElement('div');
  textEl.className = 'caption-text';
  const descEl = document.createElement('div');
  descEl.className = 'caption-description';
  caption.appendChild(conceptEl);
  caption.appendChild(headlineEl);
  caption.appendChild(textEl);
  caption.appendChild(descEl);
  wrap.appendChild(caption);

  // Variation picker
  const picker = document.createElement('div');
  picker.className = 'variation-picker';
  picker.innerHTML = `<span class="variation-label">Copy</span>`;

  const setVar = (idx) => {
    const v = variations[idx];
    headlineEl.textContent = v.headline || '';
    textEl.textContent = v.primary_text || '';
    descEl.textContent = v.description || '';
    picker.querySelectorAll('.var-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  };

  variations.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'var-btn' + (i === 0 ? ' active' : '');
    btn.textContent = i + 1;
    btn.addEventListener('click', () => setVar(i));
    picker.appendChild(btn);
  });

  if (variations.length > 0) setVar(0);
  wrap.appendChild(picker);

  const container = document.createElement('div');
  container.appendChild(wrap);
  return container;
}

load();
</script>
</body>
</html>
