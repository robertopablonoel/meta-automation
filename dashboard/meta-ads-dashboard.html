<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spicy Cubes — Meta Ads Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #faf1e0;
    font-family: 'Georgia', serif;
    color: #000;
    min-height: 100vh;
  }

  header {
    background-color: #7b1c14;
    padding: 32px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid #ff473b;
  }

  header h1 {
    color: #fdfaf1;
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  header .subtitle {
    color: #FCA5A5;
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 4px;
    font-style: italic;
  }

  .badge {
    background: #ff473b;
    color: #fdfaf1;
    font-size: 11px;
    font-family: monospace;
    padding: 6px 14px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    gap: 48px;
  }

  .category-block {
    background: #fdfaf1;
    border-radius: 12px;
    border: 1px solid #e8d9bc;
    box-shadow: 0 4px 20px rgba(123,28,20,0.08);
    overflow: hidden;
  }

  .category-header {
    background: #7b1c14;
    padding: 20px 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }

  .category-title {
    color: #fdfaf1;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .category-label {
    color: #FCA5A5;
    font-size: 11px;
    font-family: monospace;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .video-pills {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    width: 100%;
    padding-bottom: 4px;
  }

  .video-pills .pill {
    flex-shrink: 0;
  }

  .pill {
    background: rgba(253,250,241,0.15);
    color: #fdfaf1;
    border: 1px solid rgba(253,250,241,0.3);
    font-size: 11px;
    font-family: monospace;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .variations-container {
    padding: 24px 28px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: none;
    border: 1px solid #d4b896;
    color: #444545;
    font-size: 12px;
    font-family: 'Georgia', serif;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .tab-btn:hover {
    border-color: #7b1c14;
    color: #7b1c14;
  }

  .tab-btn.active {
    background: #7b1c14;
    border-color: #7b1c14;
    color: #fdfaf1;
  }

  .variation-panel {
    display: none;
  }

  .variation-panel.active {
    display: block;
  }

  .field {
    margin-bottom: 16px;
  }

  .field-label {
    font-size: 10px;
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #7b1c14;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .field-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .field-text {
    flex: 1;
    background: #faf1e0;
    border: 1px solid #e8d9bc;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.6;
    color: #000;
    font-family: 'Georgia', serif;
  }

  .field-text.headline {
    font-size: 16px;
    font-weight: bold;
    color: #7b1c14;
  }

  .field-text.description {
    font-size: 13px;
    color: #444545;
  }

  .copy-btn {
    background: #fdfaf1;
    border: 1px solid #d4b896;
    color: #7b1c14;
    font-size: 11px;
    font-family: monospace;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .copy-btn:hover {
    background: #7b1c14;
    color: #fdfaf1;
    border-color: #7b1c14;
  }

  .copy-btn.copied {
    background: #ff473b;
    color: #fdfaf1;
    border-color: #ff473b;
  }

  .copy-all-btn {
    background: #ff473b;
    color: #fdfaf1;
    border: none;
    font-size: 12px;
    font-family: monospace;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .copy-all-btn:hover {
    background: #7b1c14;
  }

  .copy-all-btn.copied {
    background: #444545;
  }

  .divider {
    border: none;
    border-top: 1px solid #e8d9bc;
    margin: 20px 0;
  }

  footer {
    text-align: center;
    padding: 32px;
    color: #444545;
    font-size: 12px;
    font-family: monospace;
    letter-spacing: 1px;
  }

  .export-btn {
    background: #fdfaf1;
    color: #7b1c14;
    border: 2px solid #fdfaf1;
    font-size: 12px;
    font-family: monospace;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .export-btn:hover {
    background: #ff473b;
    border-color: #ff473b;
    color: #fdfaf1;
  }

  .export-btn.success {
    background: #2d6a2d;
    border-color: #2d6a2d;
    color: #fdfaf1;
    cursor: default;
  }

  .export-btn.error {
    background: #ff473b;
    border-color: #ff473b;
    color: #fdfaf1;
  }

  .campaign-inputs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-right: 4px;
  }

  .campaign-inputs label {
    color: #FCA5A5;
    font-size: 10px;
    font-family: monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .campaign-inputs input {
    background: rgba(253,250,241,0.12);
    border: 1px solid rgba(253,250,241,0.3);
    color: #fdfaf1;
    font-family: monospace;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    width: 220px;
    outline: none;
  }

  .campaign-inputs input:focus {
    border-color: rgba(253,250,241,0.7);
    background: rgba(253,250,241,0.18);
  }

  .error-state {
    text-align: center;
    padding: 80px 32px;
    color: #7b1c14;
    font-family: monospace;
  }

  .error-state h2 {
    font-size: 18px;
    margin-bottom: 12px;
  }

  .error-state p {
    font-size: 13px;
    color: #444545;
  }

  .expand-btn {
    background: rgba(253,250,241,0.15);
    border: 1px solid rgba(253,250,241,0.3);
    color: #fdfaf1;
    font-size: 11px;
    font-family: monospace;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .expand-btn:hover {
    background: rgba(253,250,241,0.3);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: #fdfaf1;
    border-radius: 12px;
    border: 1px solid #e8d9bc;
    padding: 28px;
    max-width: 640px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  }

  .modal-title {
    font-size: 16px;
    font-weight: bold;
    color: #7b1c14;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .modal-subtitle {
    font-size: 11px;
    font-family: monospace;
    color: #444545;
    margin-bottom: 20px;
  }

  .modal-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .modal-pill {
    background: #faf1e0;
    border: 1px solid #e8d9bc;
    color: #7b1c14;
    font-size: 12px;
    font-family: monospace;
    padding: 6px 12px;
    border-radius: 20px;
  }

  .modal-close {
    display: block;
    margin-top: 20px;
    margin-left: auto;
    background: #7b1c14;
    color: #fdfaf1;
    border: none;
    font-size: 12px;
    font-family: monospace;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .modal-close:hover {
    background: #ff473b;
  }
</style>

<!-- Modal -->
<div class="modal-overlay" id="pillModal" onclick="if(event.target===this)closePillModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-subtitle" id="modalSubtitle"></div>
    <div class="modal-pills" id="modalPills"></div>
    <button class="modal-close" onclick="closePillModal()">Close</button>
  </div>
</div>
</head>
<body>

<header>
  <div>
    <h1>Spicy Cubes</h1>
    <div class="subtitle">Meta Ads Copy Dashboard</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="campaign-inputs">
      <div>
        <label>Campaign</label>
        <input type="text" id="campaignName" value="Spicy Cubes Dailies - English UGC" />
      </div>
      <div>
        <label>Ad Set</label>
        <input type="text" id="adSetName" value="Batch #4" />
      </div>
    </div>
    <div class="badge" id="badge">Loading...</div>
    <button class="export-btn" id="exportBtn" onclick="exportToConfig()">↓ Export for Meta</button>
  </div>
</header>

<main id="main"></main>

<footer>spicycubes.com — meta ads pipeline output</footer>

<script>
// ── Language ──────────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
let uiLang = params.get('lang') || 'es';  // resolved after data loads

const T = {
  en: {
    loading: 'Loading...',
    noData: 'No data',
    badge: (cats, vids, vars) => `${cats} Categories · ${vids} Videos · ${vars} Variations`,
    variation: i => `Variation ${i}`,
    copy: 'Copy',
    copied: '✓ Copied',
    copyAll: 'Copy All',
    allCopied: '✓ All Copied',
    noFile: 'No output file found',
    noFileHint: 'Run the pipeline first: <code>venv/bin/python -m pipeline.run --language en</code>',
  },
  es: {
    loading: 'Cargando...',
    noData: 'Sin datos',
    badge: (cats, vids, vars) => `${cats} Categorías · ${vids} Videos · ${vars} Variaciones`,
    variation: i => `Variación ${i}`,
    copy: 'Copiar',
    copied: '✓ Copiado',
    copyAll: 'Copiar Todo',
    allCopied: '✓ Todo Copiado',
    noFile: 'No se encontró el archivo de output',
    noFileHint: 'Corre el pipeline primero: <code>venv/bin/python -m pipeline.run --language es</code>',
  },
};

function t() { return T[uiLang] || T.es; }

// ── Data ──────────────────────────────────────────────────────────────────
function toLabel(concept) {
  return concept.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function buildData(raw) {
  const map = new Map();
  for (const item of raw) {
    const key = item.creative_concept;
    if (!key) continue;
    if (!map.has(key)) {
      map.set(key, {
        concept: key,
        label: toLabel(key),
        videos: [],
        ad_filenames: [],
        variations: item.ad_copy_variations || [],
      });
    }
    map.get(key).videos.push(item.filename);
    if (item.ad_filename) map.get(key).ad_filenames.push(item.ad_filename);
  }
  return Array.from(map.values()).filter(c => c.variations.length > 0);
}

// Variation data store — keyed by "ci-vi", avoids inline JSON in onclick attrs
const varStore = {};
// Active variation per category index
const activeVar = {};
// Video filename → Meta Video ID mapping
let videoIds = {};
// Hook text (first ~6 words of transcript) per category index
// Category metadata per index
const catStore = {};

async function loadData() {
  const langParam = params.get('lang');
  const candidates = langParam
    ? [`../output/consolidated_${langParam}.json`]
    : ['../output/consolidated_es.json', '../output/consolidated_en.json', '../output/consolidated.json'];

  for (const url of candidates) {
    try {
      const res = await fetch(`${url}?t=${Date.now()}`);
      if (!res.ok) continue;
      const raw = await res.json();
      const fileLang = url.match(/consolidated_(\w+)\.json/)?.[1];
      if (fileLang && fileLang !== 'auto') uiLang = fileLang;
      document.title = `Spicy Cubes — ${url.split('/').pop().replace('.json', '')}`;
      return buildData(raw);
    } catch (_) { continue; }
  }

  document.getElementById('main').innerHTML = `
    <div class="error-state">
      <h2>${t().noFile}</h2>
      <p>${t().noFileHint}</p>
    </div>`;
  document.getElementById('badge').textContent = t().noData;
  return null;
}

// ── Pill Modal ────────────────────────────────────────────────────────────
function openPillModal(ci) {
  const cat = catStore[ci];
  document.getElementById('modalTitle').textContent = cat.label;
  document.getElementById('modalSubtitle').textContent = `${cat.ad_filenames.length} videos`;
  document.getElementById('modalPills').innerHTML = cat.ad_filenames.map(f =>
    `<span class="modal-pill">${escapeHtml(f)}</span>`
  ).join('');
  document.getElementById('pillModal').classList.add('open');
}

function closePillModal() {
  document.getElementById('pillModal').classList.remove('open');
}

// ── Copy helpers ──────────────────────────────────────────────────────────
function copyField(ci, vi, field, btn) {
  const text = varStore[`${ci}-${vi}`]?.[field] || '';
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = t().copied;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = t().copy; btn.classList.remove('copied'); }, 1500);
  });
}

function copyAll(ci, vi, btn) {
  const v = varStore[`${ci}-${vi}`] || {};
  const full = `PRIMARY TEXT:\n${v.primary_text || ''}\n\nHEADLINE:\n${v.headline || ''}\n\nDESCRIPTION:\n${v.description || ''}`;
  navigator.clipboard.writeText(full).then(() => {
    btn.textContent = t().allCopied;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = t().copyAll; btn.classList.remove('copied'); }, 1500);
  });
}

function switchTab(ci, vi) {
  document.querySelectorAll(`.variation-panel[data-cat="${ci}"]`).forEach(p => p.classList.remove('active'));
  document.querySelectorAll(`.tab-btn[data-cat="${ci}"]`).forEach(b => b.classList.remove('active'));
  document.querySelector(`.variation-panel[data-cat="${ci}"][data-var="${vi}"]`).classList.add('active');
  document.querySelector(`.tab-btn[data-cat="${ci}"][data-var="${vi}"]`).classList.add('active');
  activeVar[ci] = vi;
}

// ── Render ────────────────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Meta Export ───────────────────────────────────────────────────────────
async function exportToConfig() {
  const btn = document.getElementById('exportBtn');
  const campaignName = document.getElementById('campaignName').value.trim() || 'Spicy Cubes Dailies - English UGC';
  const adSetName = document.getElementById('adSetName').value.trim() || 'Batch #4';

  const ads = [];
  Object.keys(catStore).forEach(ci => {
    const cat = catStore[ci];
    const vi = activeVar[ci] ?? 0;
    const v = varStore[`${ci}-${vi}`];
    if (!v) return;

    cat.ad_filenames.forEach(filename => {
      ads.push({
        creative_concept: cat.concept,
        video_filename: filename,
        primary_text: v.primary_text || '',
        headline: v.headline || '',
        description: v.description || '',
      });
    });
  });

  if (ads.length === 0) {
    btn.textContent = 'No ads to export';
    btn.classList.add('error');
    setTimeout(() => { btn.textContent = '↓ Export for Meta'; btn.classList.remove('error'); }, 3000);
    return;
  }

  const config = { campaign_name: campaignName, ad_set_name: adSetName, daily_budget: 20000, ads };

  try {
    const res = await fetch('http://localhost:8765/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    const json = await res.json();
    if (json.ok) {
      btn.textContent = `✓ Saved ${ads.length} ads — run python -m scripts.meta_upload`;
      btn.classList.add('success');
      setTimeout(() => { btn.textContent = '↓ Export for Meta'; btn.classList.remove('success'); }, 8000);
    } else {
      throw new Error(json.error || 'Unknown error');
    }
  } catch (e) {
    btn.textContent = `Error: ${e.message}`;
    btn.classList.add('error');
    setTimeout(() => { btn.textContent = '↓ Export for Meta'; btn.classList.remove('error'); }, 5000);
  }
}

async function init() {
  // Try to load video ID mapping
  try {
    const res = await fetch('../output/video_ids.json');
    if (res.ok) videoIds = await res.json();
  } catch (_) {}

  const data = await loadData();
  if (!data) return;

  const totalVideos = data.reduce((n, c) => n + c.videos.length, 0);
  const totalVariations = data.reduce((n, c) => n + c.variations.length, 0);
  document.getElementById('badge').textContent = t().badge(data.length, totalVideos, totalVariations);

  const main = document.getElementById('main');
  data.forEach((cat, ci) => {
    // Store variations for safe retrieval by copy buttons
    cat.variations.forEach((v, vi) => { varStore[`${ci}-${vi}`] = v; });
    activeVar[ci] = 0;
    catStore[ci] = cat;

    const block = document.createElement('div');
    block.className = 'category-block';

    const pills = cat.ad_filenames.map(f => {
      const hook = f.replace(/^[^-]+-/, '').replace(/\.[^.]+$/, '');
      return `<span class="pill">${escapeHtml(hook)}</span>`;
    }).join('');

    const tabs = cat.variations.map((_, vi) =>
      `<button class="tab-btn${vi === 0 ? ' active' : ''}" data-cat="${ci}" data-var="${vi}" onclick="switchTab(${ci},${vi})">${t().variation(vi + 1)}</button>`
    ).join('');

    const panels = cat.variations.map((v, vi) => `
      <div class="variation-panel${vi === 0 ? ' active' : ''}" data-cat="${ci}" data-var="${vi}">
        <div class="field">
          <div class="field-label">Primary Text</div>
          <div class="field-row">
            <div class="field-text">${escapeHtml(v.primary_text || '')}</div>
            <button class="copy-btn" onclick="copyField(${ci},${vi},'primary_text',this)">${t().copy}</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">Headline</div>
          <div class="field-row">
            <div class="field-text headline">${escapeHtml(v.headline || '')}</div>
            <button class="copy-btn" onclick="copyField(${ci},${vi},'headline',this)">${t().copy}</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">Description</div>
          <div class="field-row">
            <div class="field-text description">${escapeHtml(v.description || '')}</div>
            <button class="copy-btn" onclick="copyField(${ci},${vi},'description',this)">${t().copy}</button>
          </div>
        </div>
        <button class="copy-all-btn" onclick="copyAll(${ci},${vi},this)">${t().copyAll}</button>
      </div>
    `).join('');

    block.innerHTML = `
      <div class="category-header">
        <div style="flex-shrink:0">
          <div class="category-title">${escapeHtml(cat.label)}</div>
          <div class="category-label">${escapeHtml(cat.concept)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;flex:1 1 0">
          <div class="video-pills">${pills}</div>
        </div>
        <button class="expand-btn" style="flex-shrink:0" onclick="openPillModal(${ci})">⊞ All</button>
      </div>
      <div class="variations-container">
        <div class="tabs">${tabs}</div>
        ${panels}
      </div>
    `;

    main.appendChild(block);
  });
}

init();
</script>
</body>
</html>
